name: installers

# Build stand-alone installers (bundled python-build-standalone + PySide6).
# Runs on version tags (assets are attached to the GitHub release), on pull
# requests that touch the installer (assets are uploaded as workflow artifacts
# for checking) and on manual dispatch.

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
    paths:
      - "installer/**"
      - ".github/workflows/installer.yml"
      - "src/himena/__main__.py"
  workflow_dispatch:
    inputs:
      himena_spec:
        description: "pip requirement for himena (empty = this checkout)"
        required: false
        default: ""

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
          - name: macos-aarch64
            os: macos-latest
          - name: macos-x86_64
            os: macos-15-intel
          - name: linux-x86_64
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (build script only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        uses: tlambert03/setup-qt-libs@v1.5

      - name: Cache python-build-standalone
        uses: actions/cache@v4
        with:
          path: installer/build/cache
          key: pbs-${{ matrix.name }}-${{ hashFiles('installer/build.py') }}

      - name: Build installer
        shell: bash
        run: |
          SPEC="${{ github.event.inputs.himena_spec }}"
          if [ -n "$SPEC" ]; then
            python installer/build.py --himena-spec "$SPEC"
          else
            python installer/build.py
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: himena-${{ matrix.name }}
          path: |
            installer/build/dist/*.exe
            installer/build/dist/*.dmg
            installer/build/dist/*.tar.gz
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/build/dist/*.exe
            installer/build/dist/*.dmg
            installer/build/dist/*.tar.gz
